version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aiep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiep_db
      POSTGRES_USER: aiep_user
      POSTGRES_PASSWORD: aiep_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiep_user -d aiep_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: aiep-chromadb
    restart: unless-stopped
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local
